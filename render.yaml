services:
  - type: web
    name: mediamind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
    disk:
      name: analysis-cache
      mountPath: /opt/render/project/src/analysis_cache
      sizeGB: 1